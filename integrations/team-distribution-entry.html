<!-- BAIagent Distribution: independent entry for balanov.pro/team/ -->
<style>
  .distribution-owner-entry{width:min(1180px,calc(100% - 40px));margin:64px auto 0;padding:38px 42px;display:flex;align-items:center;justify-content:space-between;gap:32px;box-sizing:border-box;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:34px;background:radial-gradient(circle at 86% 10%,rgba(43,107,255,.4),transparent 26rem),#14162b;color:#fff;box-shadow:0 24px 70px rgba(16,18,35,.13);font-family:Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .distribution-owner-entry[hidden]{display:none}
  .distribution-owner-entry__copy{max-width:690px}
  .distribution-owner-entry__eyebrow{margin:0 0 12px;color:#7ee5ba;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .distribution-owner-entry h2{margin:0 0 13px;color:#fff;font-size:clamp(28px,3.4vw,46px);line-height:1.04;letter-spacing:-.05em}
  .distribution-owner-entry__text{margin:0;color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}
  .distribution-owner-entry__link{min-height:54px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;box-sizing:border-box;padding:0 24px;border-radius:999px;background:#2b6bff;color:#fff;text-decoration:none;font-size:14px;font-weight:800;box-shadow:0 12px 30px rgba(43,107,255,.32);transition:.2s ease}
  .distribution-owner-entry__link:hover{transform:translateY(-2px);background:#4b82ff}
  .distribution-owner-entry__link:focus-visible{outline:3px solid #ffc94d;outline-offset:4px}
  @media(max-width:720px){.distribution-owner-entry{width:calc(100% - 28px);margin-top:40px;padding:28px 24px;align-items:flex-start;flex-direction:column;border-radius:26px}.distribution-owner-entry__link{width:100%}}
</style>
<aside class="distribution-owner-entry" id="distribution-owner-entry" aria-labelledby="distribution-owner-entry-title" hidden>
  <div class="distribution-owner-entry__copy">
    <p class="distribution-owner-entry__eyebrow">BAIagent Distribution · уже в релизе</p>
    <h2 id="distribution-owner-entry-title">Уже владеете продуктом?</h2>
    <p class="distribution-owner-entry__text">Паспорт продукта, приоритетные каналы, взаимный бартер и автопилот. Веб работает сразу, локальный агент — без облачных токенов.</p>
  </div>
  <a class="distribution-owner-entry__link" href="https://owners.startpervyh.ru/">Найти путь к рынку&nbsp; →</a>
</aside>
<script>
  (() => {
    const entry = document.getElementById('distribution-owner-entry');
    const root = document.getElementById('root');
    const mount = () => {
      const products = document.getElementById('products');
      if (!entry || !products) return false;
      products.parentNode.insertBefore(entry, products);
      entry.hidden = false;
      return true;
    };
    if (mount() || !root) return;
    const observer = new MutationObserver(() => {
      if (mount()) observer.disconnect();
    });
    observer.observe(root, { childList: true, subtree: true });
  })();
</script>
